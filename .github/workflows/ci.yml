name: CI

on:
  push:
    paths:
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.py"
      - "CMakeLists.txt"
      - "pytest.ini"
      - "conftest.py"
      - ".github/workflows/ci.yml"

jobs:
  cpp-tests:
    # No libtorch on this runner — CMakeLists.txt only requires it for the
    # q_learning/dqn_test targets, so this job builds/tests the libtorch-free
    # targets only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies (googletest, etc.)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --target splitmix64_test philox32x4_test

      - name: Test
        run: ctest --test-dir build -R "SplitMix64Test|Philox32x4" --output-on-failure

  python-tests:
    # No torch/loguru here — test_stopping_net.py is the only file that needs
    # them. It's marked `slow` (conftest.py), but `-m "not slow"` only
    # deselects after successful collection, and collection imports every
    # test module up front, so, the file must also be explicitly ignored.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python dependencies (no torch)
        run: pip install numpy scipy pytest

      - name: Cache FetchContent dependencies (googletest, pybind11, etc.)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake -S . -B build

      - name: Build python bindings
        run: cmake --build build --target splitmix64_py philox32x4_py

      - name: Test
        run: pytest -m "not slow" --ignore=tests/python/test_stopping_net.py -q

  cuda-build:
    # Compile-only: this runner has no GPU, so philox32x4_cuda_test and
    # philox32x4_cuda_py can be built here (nvcc doesn't need a device), but
    # neither is run — launching a kernel on a GPU-less runner fails at
    # runtime, not compile time. Catches CUDA build breaks; doesn't cover
    # correctness. Run those on a CUDA-capable machine for that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: "12.6.2"
          sub-packages: '["nvcc", "cudart"]'
          method: network

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache FetchContent dependencies (googletest, pybind11, etc.)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake -S . -B build

      - name: Build CUDA targets
        run: cmake --build build --target philox32x4_cuda_test philox32x4_cuda_py
