name: CI

on:
  push:
    paths:
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"

jobs:
  splitmix64:
    # No libtorch on this runner — CMakeLists.txt only requires it for the
    # q_learning/dqn_test targets, so this job builds/tests splitmix64 only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies (googletest, etc.)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --target splitmix64 splitmix64_test

      - name: Test
        run: ctest --test-dir build -R SplitMix64Test --output-on-failure
